# Production Nginx config for the trading engine frontend.
#
# Serves the built static React app and transparently proxies /api and
# /actuator to the Spring Boot backend, so the browser only ever talks to
# this one origin - no CORS configuration is needed on the backend, and no
# backend URL is ever hardcoded into the frontend JavaScript bundle.
#
# ${BACKEND_UPSTREAM} (default "backend:8080", see Dockerfile ENV) is
# substituted at container startup by the official nginx image's
# docker-entrypoint envsubst-on-templates step - override it with
# `docker run -e BACKEND_UPSTREAM=host:port` or the equivalent in
# docker-compose.yml, no image rebuild required.
#
# The upstream host is resolved lazily, per request (via `resolver` +
# a variable in `proxy_pass`), rather than once at nginx startup - so this
# container starts and serves the SPA correctly even if the backend isn't
# reachable yet (API calls simply get a 502 until it is), instead of
# crashing on boot the way a static `proxy_pass http://backend:8080;` would.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set $backend_upstream "${BACKEND_UPSTREAM}";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml+rss;
    gzip_min_length 1024;

    # Long-lived caching for hashed static assets produced by the Vite build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Backend API - Spring Boot's REST controllers (com.example.trading.controller.*).
    #
    # NOTE: proxy_pass's URI portion is deliberately omitted here. With a
    # variable in proxy_pass, nginx does NOT do its usual "replace the
    # matched location prefix" rewriting - the URI you write is sent
    # verbatim, discarding the rest of the original path. Since backend
    # routes live at the same paths the frontend calls (/api/... -> /api/...,
    # no prefix stripping needed), forwarding $request_uri unchanged is
    # exactly correct and avoids that trap.
    location /api/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring Boot Actuator (health/info) - see application.yml management.endpoints.web.exposure.include.
    location /actuator/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback - React Router owns all other client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

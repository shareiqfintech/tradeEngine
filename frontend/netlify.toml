# Netlify deployment config for the trading engine frontend.
#
# Mirrors nginx.conf's design intent: the browser only ever talks to this
# one origin. /api and /actuator are proxied (not redirected) to the
# Cloud Run backend, so no CORS configuration is needed there and no backend
# URL is hardcoded into the frontend JS bundle (VITE_API_BASE_URL stays
# unset, apiClient.ts falls back to a relative baseURL).

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://tradeengine-backend-31717385212.us-central1.run.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/actuator/*"
  to = "https://tradeengine-backend-31717385212.us-central1.run.app/actuator/:splat"
  status = 200
  force = true

# SPA fallback - React Router owns all other client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
